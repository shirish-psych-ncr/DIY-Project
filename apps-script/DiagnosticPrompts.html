<!doctype html><html><head><base target="_top"><style>
body{font:14px Arial,sans-serif;color:#182c27;margin:16px;background:#f7f7f3}h2{font-size:20px;margin:0 0 8px}.hint{line-height:1.45;color:#52645e}.card{background:#fff;border:1px solid #d9e0da;border-radius:9px;padding:13px;margin:12px 0}.meta{font-size:12px;color:#52645e}button,select,textarea{font:14px Arial,sans-serif;padding:8px;border-radius:5px}button{border:0;background:#285f50;color:#fff;cursor:pointer}select,textarea{border:1px solid #9daea4;width:100%;box-sizing:border-box;margin:6px 0}textarea{min-height:54px}.status{font-weight:bold}.error{color:#9b372b}
</style></head><body>
<h2>Review differential prompts</h2>
<p class="hint">These deterministic, source-triggered suggestions are prompts for clinician review. Tiers are organizational labels, not probabilities. Review them in context; no prompt sets or confirms a diagnosis.</p>
<div id="content">Loading…</div>
<script>
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function load(){google.script.run.withSuccessHandler(render).withFailureHandler(e=>{document.getElementById('content').textContent=e.message||String(e);}).mgGetDiagnosticPromptRows();}
function render(result){const host=document.getElementById('content');if(!result.enabled){host.textContent='Diagnostic prompts are disabled pending clinical and intended-use review.';return;}if(!result.items.length){host.textContent='No prompts are waiting for review.';return;}
host.innerHTML=result.items.map(x=>`<section class="card" data-id="${esc(x.suggestionId)}"><strong>${esc(x.label)}</strong><div class="meta">Client ID: ${esc(x.clientId)} · Organization tier: ${esc(x.tier)}</div><p><strong>Triggered by:</strong> ${esc((x.sources||[]).join(', '))}</p><p><strong>Rationale:</strong> ${esc(x.rationale)}</p><p><strong>References:</strong> ${esc([x.references?.dsm5,x.references?.icd11].filter(Boolean).join(' / ')||'Not supplied')}</p><div class="meta">Current status: ${esc(x.status)}${x.disposition?`; disposition: ${esc(x.disposition)}`:''}</div><select aria-label="Prompt disposition"><option value="">Choose review outcome</option><option value="considered">Considered in clinical review</option><option value="not_relevant">Not relevant to this encounter</option><option value="needs_follow_up">Needs follow-up</option><option value="deferred">Deferred</option></select><textarea aria-label="Optional clinician note" placeholder="Optional review note"></textarea><button type="button" onclick="save(this)">Save review outcome</button><div class="status" role="status"></div></section>`).join('');}
function save(button){const card=button.closest('.card'),choice=card.querySelector('select').value;if(!choice){card.querySelector('.status').textContent='Choose an outcome first.';return;}button.disabled=true;google.script.run.withSuccessHandler(()=>{card.querySelector('.status').textContent='Review outcome recorded. No diagnosis was changed.';button.disabled=false;load();}).withFailureHandler(e=>{card.querySelector('.status').textContent=e.message||String(e);button.disabled=false;}).mgReviewDiagnosticPrompt(card.dataset.id,choice,card.querySelector('textarea').value);}
load();
</script></body></html>
